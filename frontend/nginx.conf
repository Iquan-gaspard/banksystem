# 流量限制（依來源 IP）：一般 API 每秒 20 次；登入每分鐘 5 次（緩解暴力破解密碼）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 轉送給 Application Server 的共用設定（各 location 繼承）
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Nginx 是最外層入口：以實際連線 IP 覆蓋 X-Forwarded-For，不沿用用戶端自帶的值（防止偽造來源 IP）
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    error_page 429 = @too_many_requests;

    # 登入：較嚴格的流量限制
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://backend:8080;
    }

    # RESTful API → Application Server（Spring Boot）
    # 安全 header（CSP、nosniff、X-Frame-Options、Cache-Control）由後端 Spring Security 設定
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://backend:8080;
    }

    # Vue 單頁應用（靜態檔）
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }

    location @too_many_requests {
        default_type application/problem+json;
        charset utf-8;
        charset_types application/problem+json;
        add_header X-Content-Type-Options "nosniff" always;
        return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"請求過於頻繁，請稍後再試"}';
    }
}
