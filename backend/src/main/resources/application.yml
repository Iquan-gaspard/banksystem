spring:
  application:
    name: banksystem
  datasource:
    # 連線資訊由環境變數提供（docker-compose / .env），密碼不寫死在程式碼
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/banksystem?characterEncoding=UTF-8&connectionTimeZone=Asia/Taipei
    username: ${DB_USERNAME:banksystem_app}
    password: ${DB_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true
  jackson:
    # 未定義的 JSON 欄位直接拒絕（例如前端偷傳 totalFee），避免被竄改金額
    deserialization:
      fail-on-unknown-properties: true
      # 整數欄位收到小數（例如購買數量 1.5）直接拒絕，不可默默截斷成 1
      accept-float-as-int: false

server:
  port: 8080
  # 經 Nginx 反向代理時，由 X-Forwarded-For 取得真實來源 IP（寫入操作紀錄）
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 15m
      cookie:
        http-only: true        # JavaScript 讀不到 Session cookie（防 XSS 竊取）
        same-site: lax         # 跨站請求不帶 cookie（CSRF 第二層防護）
        secure: ${COOKIE_SECURE:false}   # 啟用 HTTPS 時設為 true
  error:
    # 錯誤回應不帶 stack trace / 例外訊息，避免資訊外洩
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

# 健康檢查：只開放 health（含資料庫連線檢查），不顯示細節；/actuator 不經 Nginx 對外
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
