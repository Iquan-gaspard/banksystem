name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: 後端測試（含 Testcontainers 整合測試）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 編譯與測試
        run: ./mvnw -B verify

  frontend:
    name: 前端建置
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: Docker Compose 啟動與冒煙測試
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: 啟動整套系統
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - name: 登入並呼叫 API
        run: |
          set -e
          JAR=cookies.txt
          xsrf() { grep XSRF-TOKEN "$JAR" | awk '{print $7}'; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/)" = 200
          test "$(curl -s -c $JAR -b $JAR -o /dev/null -w '%{http_code}' http://localhost:8088/api/auth/me)" = 401
          test "$(curl -s -c $JAR -b $JAR -o /dev/null -w '%{http_code}' -X POST http://localhost:8088/api/auth/login \
                 -H "X-XSRF-TOKEN: $(xsrf)" -d 'userId=A1236456789&password=Demo@1234')" = 200
          test "$(curl -s -b $JAR -o /dev/null -w '%{http_code}' http://localhost:8088/api/users/A1236456789/likes)" = 200
          test "$(curl -s -b $JAR -o /dev/null -w '%{http_code}' http://localhost:8088/api/users/B2345678901/likes)" = 403
          echo "冒煙測試通過"
      - name: 失敗時輸出 log
        if: failure()
        run: docker compose logs --no-color
